services:
  jobtrack-postgres:
    image: postgres:16-alpine
    container_name: jobtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobtrack_dev
    ports:
      - "5432:5432"
    volumes:
      - jobtrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobtrack_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  jobtrack_pgdata:
